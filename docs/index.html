<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ScanRebut</title>
  <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --ok: #2ecc71;
      --nok: #e74c3c;
      --bg: #0f1115;
      --panel: #1b1f27;
      --panel2: #262b35;
      --text: #f2f4f8;
      --muted: #8b93a3;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
      user-select: none;
    }
    #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

    /* ---------- Écran de configuration ---------- */
    #setupScreen {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      padding: 24px; gap: 16px;
    }
    #setupScreen h1 { font-size: 22px; margin: 0 0 4px; text-align: center; }
    #setupScreen p.sub { color: var(--muted); text-align: center; margin: 0 0 16px; font-size: 14px; }
    label { font-size: 14px; color: var(--muted); }
    #refInput {
      width: 100%; padding: 16px; font-size: 20px; border-radius: 12px;
      border: 2px solid var(--panel2); background: var(--panel); color: var(--text);
      text-transform: uppercase;
    }
    #refInput:focus { outline: none; border-color: var(--accent); }
    button {
      border: none; border-radius: 12px; padding: 16px; font-size: 18px;
      font-weight: 600; cursor: pointer; color: #fff;
    }
    button:active { filter: brightness(0.85); }
    #startBtn { background: var(--accent); }
    #setupError { color: var(--nok); font-size: 14px; min-height: 18px; text-align: center; }

    /* ---------- Écran de scan ---------- */
    #scanScreen { flex: 1; display: none; flex-direction: column; position: relative; overflow: hidden; }
    #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }

    #guide {
      position: absolute; top: 30%; left: 12%; right: 12%; bottom: 42%;
      border: 3px solid rgba(255,255,255,0.75); border-radius: 16px;
      box-shadow: 0 0 0 999px rgba(0,0,0,0.35);
      pointer-events: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    #guide.flashOk { border-color: var(--ok); box-shadow: 0 0 0 999px rgba(46,204,113,0.25); }
    #guide.flashNok { border-color: var(--nok); box-shadow: 0 0 0 999px rgba(231,76,60,0.25); }

    #topBar {
      position: absolute; top: 0; left: 0; right: 0; padding: 12px 14px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(rgba(0,0,0,0.65), transparent);
      z-index: 2;
    }
    #topBar .refLabel { font-size: 13px; color: var(--muted); }
    #topBar .refValue { font-size: 18px; font-weight: 700; }
    #counters { display: flex; gap: 10px; }
    .counter { text-align: center; }
    .counter .n { font-size: 20px; font-weight: 700; }
    .counter .l { font-size: 11px; color: var(--muted); }
    .counter.ok .n { color: var(--ok); }
    .counter.nok .n { color: var(--nok); }

    #torchBtn {
      position: absolute; top: 78px; right: 12px; z-index: 3;
      background: rgba(20,22,28,0.7); width: 44px; height: 44px; padding: 0;
      border-radius: 22px; font-size: 20px; display: none;
      align-items: center; justify-content: center;
    }

    #banner {
      position: absolute; top: 64px; left: 14px; right: 14px; z-index: 3;
      padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 15px;
      text-align: center; opacity: 0; transform: translateY(-8px);
      transition: opacity 0.15s, transform 0.15s; pointer-events: none;
    }
    #banner.show { opacity: 1; transform: translateY(0); }
    #banner.ok { background: rgba(46,204,113,0.92); color: #06210f; }
    #banner.nok { background: rgba(231,76,60,0.92); color: #2a0b08; }

    #bottomSheet {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      background: linear-gradient(transparent, rgba(0,0,0,0.75) 30%, rgba(0,0,0,0.9));
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 8px;
    }
    #history { display: flex; flex-direction: column-reverse; gap: 4px; max-height: 96px; overflow-y: auto; }
    .histItem { font-size: 12px; display: flex; justify-content: space-between; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.06); }
    .histItem .badge { font-weight: 700; }
    .histItem.ok .badge { color: var(--ok); }
    .histItem.nok .badge { color: var(--nok); }
    #finishBtn { background: var(--nok); }

    /* ---------- Écran résultat ---------- */
    #resultScreen { flex: 1; display: none; flex-direction: column; padding: 22px; gap: 14px; overflow-y: auto; }
    #resultScreen h2 { margin: 0; font-size: 20px; }
    .card { background: var(--panel); border-radius: 12px; padding: 14px 16px; }
    .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--panel2); font-size: 15px; }
    .row:last-child { border-bottom: none; }
    #newSessionBtn { background: var(--accent); }
    #savingMsg { text-align: center; color: var(--muted); }
  </style>
</head>
<body>
<div id="app">

  <!-- ===================== ÉCRAN 1 : configuration ===================== -->
  <div id="setupScreen">
    <h1>📦 ScanRebut</h1>
    <p class="sub">Saisissez la référence en cours puis démarrez le scan.</p>
    <label for="refInput">Référence en cours</label>
    <input id="refInput" type="text" placeholder="EX: EF4052C" autocomplete="off" autocorrect="off" spellcheck="false">
    <div id="setupError"></div>
    <button id="startBtn">▶️ Démarrer le scan</button>
  </div>

  <!-- ===================== ÉCRAN 2 : scan caméra (vidéo continue) ===================== -->
  <div id="scanScreen">
    <video id="video" autoplay playsinline muted></video>
    <div id="guide"></div>
    <div id="banner"></div>
    <button id="torchBtn">🔦</button>

    <div id="topBar">
      <div>
        <div class="refLabel">Référence</div>
        <div class="refValue" id="refDisplay">—</div>
      </div>
      <div id="counters">
        <div class="counter ok"><div class="n" id="okCount">0</div><div class="l">OK</div></div>
        <div class="counter nok"><div class="n" id="nokCount">0</div><div class="l">NOK</div></div>
      </div>
    </div>

    <div id="bottomSheet">
      <div id="history"></div>
      <button id="finishBtn">✅ Terminer &amp; générer le rapport</button>
    </div>
  </div>

  <!-- ===================== ÉCRAN 3 : résultat ===================== -->
  <div id="resultScreen">
    <h2>📄 Rapport généré</h2>
    <div id="savingMsg">Enregistrement en cours…</div>
    <div class="card" id="summaryCard" style="display:none;">
      <div class="row"><span>Référence</span><span id="sumRef">—</span></div>
      <div class="row"><span>Total pièces OK</span><span id="sumTotal">0</span></div>
      <div class="row"><span>Fichier</span><span id="sumFile">—</span></div>
    </div>
    <div class="card" id="triCard" style="display:none;">
      <div class="row"><strong>Tri par code défaut</strong><span></span></div>
      <div id="triList"></div>
    </div>
    <button id="newSessionBtn" style="display:none;">🔁 Nouvelle session</button>
  </div>

</div>

<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------
  // Backend Apps Script (Drive) — appelé en fetch (page hébergée hors
  // du sandbox iframe d'Apps Script, cf. déploiement ScanRebut).
  // ------------------------------------------------------------------
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwUPFZ61EmVeiZqXAzhgTiLN45Ob0iVj6ttEB26aTGLla3mc4RYWp9aAw2cVBN35ns8PQ/exec';
  var API_SECRET = 'srb_7hq2m9wz4k1x'; // jeton anti-abus simple ; visible côté client, ne remplace pas une vraie auth

  // ------------------------------------------------------------------
  // État de la session
  // ------------------------------------------------------------------
  var currentReference = '';
  var readNumeros = new Set();     // numeros_unique déjà acceptés (anti-doublon)
  var okScans = [];                // scans validés OK, envoyés au backend
  var lastRawCode = null;
  var lastRawTime = 0;
  var codeReader = null;
  var torchOn = false;

  var REPEAT_COOLDOWN_MS = 1500;   // ignore la relecture immédiate du même code

  // Format attendu : reference-date-code_defaut-numero_unique
  // Ex: EF4052C-20260903-280012-192327098
  var BARCODE_RE = /^([A-Za-z0-9]+)-(\d{8})-(\d+)-(\d+)$/;

  // ------------------------------------------------------------------
  // Références DOM
  // ------------------------------------------------------------------
  var setupScreen = document.getElementById('setupScreen');
  var scanScreen = document.getElementById('scanScreen');
  var resultScreen = document.getElementById('resultScreen');

  var refInput = document.getElementById('refInput');
  var setupError = document.getElementById('setupError');
  var startBtn = document.getElementById('startBtn');

  var video = document.getElementById('video');
  var guide = document.getElementById('guide');
  var banner = document.getElementById('banner');
  var torchBtn = document.getElementById('torchBtn');
  var refDisplay = document.getElementById('refDisplay');
  var okCountEl = document.getElementById('okCount');
  var nokCountEl = document.getElementById('nokCount');
  var historyEl = document.getElementById('history');
  var finishBtn = document.getElementById('finishBtn');

  var savingMsg = document.getElementById('savingMsg');
  var summaryCard = document.getElementById('summaryCard');
  var sumRef = document.getElementById('sumRef');
  var sumTotal = document.getElementById('sumTotal');
  var sumFile = document.getElementById('sumFile');
  var triCard = document.getElementById('triCard');
  var triList = document.getElementById('triList');
  var newSessionBtn = document.getElementById('newSessionBtn');

  // ------------------------------------------------------------------
  // Retour sonore / vibration
  // ------------------------------------------------------------------
  var audioCtx = null;
  function beep(freq, durationMs) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.value = 0.15;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + durationMs / 1000);
    } catch (e) { /* audio indisponible : on ignore */ }
  }
  function feedback(ok) {
    if (ok) { beep(1200, 120); if (navigator.vibrate) navigator.vibrate(60); }
    else { beep(300, 220); if (navigator.vibrate) navigator.vibrate([80, 60, 80]); }
  }

  // ------------------------------------------------------------------
  // Écran 1 : démarrage
  // ------------------------------------------------------------------
  startBtn.addEventListener('click', function () {
    var ref = refInput.value.trim().toUpperCase();
    if (!ref) {
      setupError.textContent = 'Merci de saisir une référence.';
      return;
    }
    setupError.textContent = '';
    currentReference = ref;
    readNumeros = new Set();
    okScans = [];
    lastRawCode = null;
    refDisplay.textContent = currentReference;
    okCountEl.textContent = '0';
    nokCountEl.textContent = '0';
    historyEl.innerHTML = '';

    setupScreen.style.display = 'none';
    scanScreen.style.display = 'flex';
    startCamera();
  });

  // ------------------------------------------------------------------
  // Caméra + scan continu DataMatrix
  // ------------------------------------------------------------------
  function startCamera() {
    var hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.DATA_MATRIX]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    codeReader = new ZXing.BrowserMultiFormatReader(hints);

    var constraints = { video: { facingMode: { ideal: 'environment' } }, audio: false };

    codeReader.decodeFromConstraints(constraints, 'video', function (result, err) {
      if (result) {
        handleDecoded(result.getText());
      }
      // err = NotFoundException à chaque frame sans code détecté : normal, on ignore.
    }).then(function () {
      setupTorch();
    }).catch(function (err) {
      showSetupCameraError(err);
    });
  }

  function showSetupCameraError(err) {
    scanScreen.style.display = 'none';
    setupScreen.style.display = 'flex';
    setupError.textContent = 'Erreur caméra : ' + (err && err.message ? err.message : err);
  }

  function setupTorch() {
    try {
      var stream = video.srcObject;
      if (!stream) return;
      var track = stream.getVideoTracks()[0];
      var caps = track.getCapabilities ? track.getCapabilities() : {};
      if (caps && caps.torch) {
        torchBtn.style.display = 'flex';
        torchBtn.onclick = function () {
          torchOn = !torchOn;
          track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function () {});
        };
      }
    } catch (e) { /* torche indisponible */ }
  }

  function stopCamera() {
    if (codeReader) {
      try { codeReader.reset(); } catch (e) {}
      codeReader = null;
    }
    torchBtn.style.display = 'none';
    torchOn = false;
  }

  // ------------------------------------------------------------------
  // Traitement d'un code décodé
  // ------------------------------------------------------------------
  function handleDecoded(raw) {
    var now = Date.now();
    if (raw === lastRawCode && (now - lastRawTime) < REPEAT_COOLDOWN_MS) {
      return; // même code encore dans le champ de la caméra : on ignore
    }
    lastRawCode = raw;
    lastRawTime = now;

    var m = BARCODE_RE.exec(raw.trim());
    if (!m) {
      registerResult(false, 'Format invalide', raw, null);
      return;
    }

    var reference = m[1].toUpperCase();
    var date = m[2];
    var codeDefaut = m[3];
    var numeroUnique = m[4];

    if (reference !== currentReference) {
      registerResult(false, 'Référence différente (' + reference + ')', raw, numeroUnique);
      return;
    }
    if (readNumeros.has(numeroUnique)) {
      registerResult(false, 'Déjà scanné', raw, numeroUnique);
      return;
    }

    readNumeros.add(numeroUnique);
    okScans.push({
      codeBarre: raw,
      reference: reference,
      date: date,
      codeDefaut: codeDefaut,
      numeroUnique: numeroUnique,
      timestamp: new Date().toISOString()
    });
    registerResult(true, 'OK', raw, numeroUnique);
  }

  function registerResult(ok, reason, raw, numeroUnique) {
    feedback(ok);

    guide.classList.remove('flashOk', 'flashNok');
    void guide.offsetWidth; // relance l'animation
    guide.classList.add(ok ? 'flashOk' : 'flashNok');

    banner.textContent = ok ? '✅ OK' : '⛔ NOK — ' + reason;
    banner.className = 'show ' + (ok ? 'ok' : 'nok');
    clearTimeout(registerResult._t);
    registerResult._t = setTimeout(function () {
      banner.classList.remove('show');
      guide.classList.remove('flashOk', 'flashNok');
    }, 900);

    okCountEl.textContent = okScans.length;
    nokCountEl.textContent = String(parseInt(nokCountEl.textContent, 10) + (ok ? 0 : 1));

    var item = document.createElement('div');
    item.className = 'histItem ' + (ok ? 'ok' : 'nok');
    var label = numeroUnique ? ('…' + numeroUnique.slice(-6)) : raw.slice(0, 18);
    item.innerHTML = '<span class="badge">' + (ok ? 'OK' : 'NOK') + '</span><span>' + label + (ok ? '' : ' — ' + reason) + '</span>';
    historyEl.appendChild(item);
    historyEl.scrollTop = historyEl.scrollHeight;
  }

  // ------------------------------------------------------------------
  // Validation de la session -> génération JSON côté serveur (Apps Script)
  // ------------------------------------------------------------------
  finishBtn.addEventListener('click', function () {
    stopCamera();
    scanScreen.style.display = 'none';
    resultScreen.style.display = 'flex';
    savingMsg.style.display = 'block';
    savingMsg.textContent = 'Enregistrement en cours…';
    summaryCard.style.display = 'none';
    triCard.style.display = 'none';
    newSessionBtn.style.display = 'none';

    // Content-Type volontairement omis (défaut text/plain) pour rester une
    // requête "simple" et éviter le preflight CORS, qu'Apps Script ne gère pas.
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ secret: API_SECRET, reference: currentReference, scans: okScans })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.error) throw new Error(data.error);
        onSaved(data);
      })
      .catch(onSaveError);
  });

  function onSaved(res) {
    savingMsg.style.display = 'none';
    summaryCard.style.display = 'block';
    triCard.style.display = 'block';
    newSessionBtn.style.display = 'block';

    sumRef.textContent = currentReference;
    sumTotal.textContent = res.total;
    sumFile.textContent = res.fileName;

    triList.innerHTML = '';
    var codes = Object.keys(res.tri || {});
    if (!codes.length) {
      triList.innerHTML = '<div class="row"><span>Aucun défaut</span><span>0</span></div>';
    } else {
      codes.sort(function (a, b) { return res.tri[b] - res.tri[a]; });
      codes.forEach(function (code) {
        var row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = '<span>' + code + '</span><span>' + res.tri[code] + '</span>';
        triList.appendChild(row);
      });
    }
  }

  function onSaveError(err) {
    savingMsg.textContent = 'Erreur lors de l\'enregistrement : ' + (err && err.message ? err.message : err);
  }

  newSessionBtn.addEventListener('click', function () {
    resultScreen.style.display = 'none';
    setupScreen.style.display = 'flex';
    refInput.value = '';
    setupError.textContent = '';
  });

})();
</script>
</body>
</html>
