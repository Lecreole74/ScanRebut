<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ScanRebut</title>
  <style>
    :root { color-scheme: dark; --bg: #0f1115; --text: #f2f4f8; --muted: #8b93a3; --accent: #3b82f6; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    #box { text-align: center; padding: 24px; max-width: 360px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
    a#openBtn {
      display: block; background: var(--accent); color: #fff; text-decoration: none;
      padding: 18px; border-radius: 12px; font-size: 18px; font-weight: 600;
    }
    a#openBtn:active { filter: brightness(0.85); }
  </style>
</head>
<body>
  <div id="box">
    <h1>📦 ScanRebut</h1>
    <p>L'application de scan tourne désormais sur une page dédiée
       (nécessaire pour l'accès caméra en continu). Appuyez pour l'ouvrir.</p>
    <a id="openBtn" href="https://lecreole74.github.io/ScanRebut/" target="_top">
      ▶️ Ouvrir ScanRebut
    </a>
  </div>
  <script>
    // Tentative de redirection automatique hors de l'iframe Apps Script.
    // Peut être silencieusement bloquée par le sandbox de Google : le
    // bouton ci-dessus reste le moyen fiable de sortir.
    try {
      window.top.location.href = 'https://lecreole74.github.io/ScanRebut/';
    } catch (e) { /* redirection bloquée : l'utilisateur tape le bouton */ }
  </script>
</body>
</html>
